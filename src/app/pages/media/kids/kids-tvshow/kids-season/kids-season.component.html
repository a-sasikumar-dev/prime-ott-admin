<div class="pages-body">
    <h2 class="page-title">Season</h2>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item d-flex align-items-center"><a class="d-flex" routerLink="/dashboard"><i-feather class="feather-icon icon-wid-md" name="home"></i-feather></a></li>
          <li class="breadcrumb-item d-flex align-items-center">Kids</li>
          <li class="breadcrumb-item d-flex align-items-center"><a routerLink="/media/kids/tvshows">TV Shows</a></li>
          <li class="breadcrumb-item d-flex align-items-center active" aria-current="page">Season</li>
        </ol>
    </nav>
    <div class="pages-information-body">
        <div class="common-subtitle mt-3">
            <h3 class="mb-0">{{tvshowName}}</h3>
        </div>
        <div class="row">
            <div class="col-list-lg col-lg-6 col-md-6 col-sm-6 col-12 mt-4">
                <a routerLink="update-season" [queryParams]="{sId: newSeasonId, tvId: tvshowId, tvshowName: tvshowName}">
                    <div class="grid-list-add-card">
                        <div class="add-content-icon">
                            <i-feather class="feather-icon icon-m-color" name="plus-circle"></i-feather>
                            <h4 class="mt-3 mb-0">Add Season</h4>
                        </div>
                    </div>
                </a>
            </div>
            <div *ngFor="let season of season" class="col-list-lg col-lg-6 col-md-6 col-sm-6 col-12 mt-4">
                <div class="grid-list-card grid-list-card-t4">
                    <div class="grid-list-card-image">
                        <img src="{{season.cover}}" alt="Image">
                    </div>
                    <div class="grid-list-card-body">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="fs-lss">{{season.episodes}} Episodes</span>
                            <span class="re-language fs-lss">{{season.certificate}}</span>
                        </div>
                        <h5 class="desc-ellipsize-l1">{{season.season_name}}</h5>
                        <p class="desc-ellipsize-l3 list-card-desc">{{season.description}}</p>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <div class="d-flex action-icons">
                                <a placement="bottom" ngbTooltip="View" class="action-item" routerLink="view-season" [queryParams]="{sId: season.season_id, tvId: tvshowId, tvshowName: tvshowName}">
                                    <i-feather class="feather-icon icon-m-color icon-wid-md" name="eye"></i-feather>
                                </a>
                                <a placement="bottom" ngbTooltip="Edit" class="action-item" routerLink="update-season" [queryParams]="{sId: season.season_id, tvId: tvshowId, tvshowName: tvshowName}">
                                    <i-feather class="feather-icon icon-m-color icon-wid-md" name="edit"></i-feather>
                                </a>
                                <a placement="bottom" ngbTooltip="Delete" class="action-item" (click)="deleteSeason(season.season_id, season.tvshow_id)">
                                    <i-feather class="feather-icon icon-cancel icon-wid-md" name="trash"></i-feather>
                                </a>
                            </div>
                            <a routerLink="episodes" [queryParams]="{sId: season.season_id, tvId: tvshowId, tvshowName: tvshowName, seasonName: season.season_name}" class="common-button border-btn fs-ls"><i-feather class="feather-icon icon-m-color icon-wid-md mr-1" name="plus"></i-feather> Add Episode</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
