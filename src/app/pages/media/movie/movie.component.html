<div class="pages-body">
    <h2 class="page-title">Movies</h2>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item d-flex align-items-center"><a class="d-flex" routerLink="/dashboard"><i-feather class="feather-icon icon-wid-md" name="home"></i-feather></a></li>
          <li class="breadcrumb-item d-flex align-items-center active" aria-current="page">Movies</li>
        </ol>
    </nav>
    <div class="pages-information-body">
        <div class="row justify-content-center">
            <div class="col-xl-3 col-lg-3 col-md-6 col-sm-6 col-12">
                <div class="form-group">
                    <div class="input-icon-box">
                        <i-feather class="feather-icon input-icon icon-wid-lg" name="search"></i-feather>
                        <input type="text" class="form-control" placeholder="Search" (keyup)="searchmovies($event, 'MovieName')">
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-lg-3 col-md-6 col-sm-6 col-12">
                <div class="form-group">
                    <div class="input-icon-box">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 0 24 24" width="20px"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>
                        <select class="form-control search-slelect" (change)="searchmovies($event, 'Language')">
                            <option>Search Language</option>
                            <option value="All">All</option>
                            <option value="Tamil">Tamil</option>
                            <option value="English">English</option>
                            <option value="Hindi">Hindi</option>
                            <option value="Malayalam">Malayalam</option>
                            <option value="Kannadam">Kannadam</option>
                            <option value="Korean">Korean</option>
                            <option value="Chineesh">Chineesh</option>
                        </select>
                        <i-feather class="feather-icon input-icon select-arrow icon-wid-lg" name="chevron-down"></i-feather>
                    </div>
                </div>
            </div>
            <!-- <div class="col-xl-3 col-lg-3 col-md-6 col-sm-6 col-12">
                <div class="form-group">
                    <div class="input-icon-box common-calendar">
                        <i-feather class="feather-icon input-icon icon-wid-lg" name="calendar"></i-feather>
                        <input type="text" class="form-control cursor" placeholder="yyyy-mm-dd" ngbDatepicker #date="ngbDatepicker" (click)="date.toggle()">
                        <i-feather class="feather-icon input-icon select-arrow icon-wid-lg cursor" name="chevron-down" (click)="date.toggle()"></i-feather>
                    </div>
                </div>
            </div> -->
            <div class="col-xl-3 col-lg-3 col-md-6 col-sm-6 col-12">
                <div class="form-group">
                    <div class="input-icon-box">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 0 24 24" width="20px"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M12 2l-5.5 9h11L12 2zm0 3.84L13.93 9h-3.87L12 5.84zM17.5 13c-2.49 0-4.5 2.01-4.5 4.5s2.01 4.5 4.5 4.5 4.5-2.01 4.5-4.5-2.01-4.5-4.5-4.5zm0 7c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5zM3 21.5h8v-8H3v8zm2-6h4v4H5v-4z"/></svg>
                        <select class="form-control search-slelect" (change)="searchmovies($event, 'Genres')">
                            <option>Search Genres</option>
                            <option value="All">All</option>
                            <option value="Action">Action</option>
                            <option value="Adventure">Adventure</option>
                            <option value="Biography">Biography</option>
                            <option value="Comedy">Comedy</option>
                            <option value="Crime">Crime</option>
                            <option value="Documentary">Documentary</option>
                            <option value="Drama">Drama</option>
                            <option value="Family">Family</option>
                            <option value="Fantasy">Fantasy</option>
                            <option value="Film-Noir">Film-Noir</option>
                            <option value="Game-Show">Game-Show</option>
                            <option value="History">History</option>
                            <option value="Horror">Horror</option>
                            <option value="International">International</option>
                            <option value="Kids">Kids</option>
                            <option value="Music">Music</option>
                            <option value="Musical">Musical</option>
                            <option value="Mystery">Mystery</option>
                            <option value="News">News</option>
                            <option value="Reality-TV">Reality-TV</option>
                            <option value="Romance">Romance</option>
                            <option value="Sci-Fi">Sci-Fi</option>
                            <option value="Sport">Sport</option>
                            <option value="Talk-Show">Talk-Show</option>
                            <option value="Thriller">Thriller</option>
                            <option value="War">War</option>
                            <option value="Western">Western</option>
                        </select>
                        <i-feather class="feather-icon input-icon select-arrow icon-wid-lg" name="chevron-down"></i-feather>
                    </div>
                </div>
            </div>
        </div>
        <div id="infinite-list" infiniteScroll
            [infiniteScrollDistance]="3"
            (scrolled)="onScrollDown()">
            <div class="row">
                <div class="col-list-lg col-lg-4 col-md-6 col-sm-6 col-12 mt-4">
                    <a routerLink="update-movie" [queryParams]="{mId: newMovieId}">
                        <div class="grid-list-add-card">
                            <div class="add-content-icon">
                                <i-feather class="feather-icon icon-m-color" name="plus-circle"></i-feather>
                                <h4 class="mt-3 mb-0">Add Movie</h4>
                            </div>
                        </div>
                    </a>
                </div>
                <div *ngFor="let movies of movies; let i = index" class="col-list-lg col-lg-4 col-md-6 col-sm-6 col-12 mt-4">
                    <div class="grid-list-card">
                        <div class="grid-list-card-image">
                            <img src="{{movies.cover}}" alt="Image">
                            <!-- <span class="badge badge-genre">Game-show</span> -->
                        </div>
                        <div class="grid-list-card-body">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="fs-lss">{{movies.released_date | date:'mediumDate'}}</span>
                                <span class="re-language fs-lss">{{movies.native_lang}}</span>
                            </div>
                            <h5 class="desc-ellipsize-l1">{{movies.movie_name}}</h5>
                            <p class="desc-ellipsize-l3 list-card-desc">{{movies.description}}</p>
                            <div class="d-flex justify-content-between">
                                <a placement="bottom" ngbTooltip="View" routerLink="view-movie" [queryParams]="{mId: movies.movie_id}">
                                    <i-feather class="feather-icon icon-m-color icon-wid-md" name="eye"></i-feather>
                                </a>
                                <a placement="bottom" ngbTooltip="Edit" routerLink="update-movie" [queryParams]="{mId: movies.movie_id}">
                                    <i-feather class="feather-icon icon-m-color icon-wid-md" name="edit"></i-feather>
                                </a>
                                <a placement="bottom" ngbTooltip="Delete" (click)="deleteMovie(movies.movie_id)">
                                    <i-feather class="feather-icon icon-cancel icon-wid-md" name="trash"></i-feather>
                                </a>
                            </div>
                            <div class="d-flex align-items-center justify-content-between mt-3">
                                <h6 class="fs-ls mb-0">Set to live</h6>
                                <label for="switch-p-{{i + 1}}" class="toggle-switch-box" *ngIf="movies.status == 'Live'">
                                    <input type="checkbox" name="hold" checked id="switch-p-{{i + 1}}" (change)="setLiveClick(movies.movie_id,$event)">
                                    <span class="toggle-switch-item" data-tg-on="Yes" data-tg-off="No">
                                      <span class="switch-button"></span>
                                    </span>
                                </label>
                                <label for="switch-p-{{i + 1}}" class="toggle-switch-box" *ngIf="movies.status == 'Hold'">
                                    <input type="checkbox" name="live" id="switch-p-{{i + 1}}" (change)="setLiveClick(movies.movie_id,$event)">
                                    <span class="toggle-switch-item" data-tg-on="Yes" data-tg-off="No">
                                      <span class="switch-button"></span>
                                    </span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
